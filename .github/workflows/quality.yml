name: site quality

# The checks only pay off if they run without being remembered, so they gate
# every push and pull request rather than living in a script someone may run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static checks
        run: bundle exec ruby scripts/doctor.rb

      - name: Build
        run: bundle exec jekyll build

      - name: Verify the diagnostic itself
        run: node scripts/selftest.mjs

      - name: Serve and diagnose
        run: |
          python3 -m http.server 4000 --directory _site --bind 127.0.0.1 &
          for _ in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:4000/ && break; sleep 0.25; done
          # Visual baselines are pixel-compared, and a CI runner rasterises
          # fonts differently from a developer machine, so the committed
          # baselines cannot match here. Regression checking stays local.
          node scripts/diagnose.mjs --url http://127.0.0.1:4000 --throttle --skip-visual

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-report
          path: debug-report/
          retention-days: 14
