# Pages CMS (https://app.pagescms.org) — browser editor for this blog.
#
# Posts stay plain Markdown files in _posts/. Saving in the CMS commits to the
# repository, and GitHub Pages rebuilds the site exactly as it does for a push.
# How to use it: docs/WRITING.md.

media:
  input: assets/images
  output: /assets/images
  categories: [image]
  # Korean or spaced filenames become safe ASCII names, so image URLs never
  # need percent-encoding.
  rename: safe

content:
  - name: posts
    label: 글
    type: collection
    path: _posts
    # Jekyll only publishes files named YYYY-MM-DD-slug.md. A Korean title
    # cannot be the slug (it would be stripped to nothing), so the slug is its
    # own English field, and the filename is shown for a final check before the
    # first save.
    filename:
      template: "{year}-{month}-{day}-{fields.slug}.md"
      field: create
    view:
      fields: [title, date, categories, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
      search: [title, excerpt]
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: slug
        label: 영문 주소
        type: string
        description: "새 글이면 꼭 입력하세요. 글 주소(URL)와 파일 이름이 됩니다. 영문 소문자, 숫자, 하이픈만. 예: stablecoin-regulation-2026"
        pattern:
          regex: "^([a-z0-9]+(-[a-z0-9]+)*)?$"
          message: "영문 소문자, 숫자, 하이픈(-)만 쓸 수 있습니다."
      - name: excerpt
        label: 요약
        type: text
        description: "홈 화면과 글 카드에 보이는 한두 문장. 비워 두면 본문 첫 문단이 쓰입니다."
      - name: date
        label: 발행 일시
        type: date
        required: true
        options:
          time: true
          # Matches the existing posts, e.g. 2026-04-13 00:50:00 +0900.
          format: "yyyy-MM-dd HH:mm:ss xx"
      - name: categories
        label: 카테고리
        type: select
        required: true
        description: "첫 번째 카테고리가 글 주소와 제목 위 라벨이 됩니다."
        options:
          multiple: true
          values: [AI, Web3, Policy, Tech, SQL, Projects, Diary, Business Strategy]
      - name: tags
        label: 태그
        type: string
        list: true
        description: "시리즈 글이면 '원화 스테이블코인 심층분석' 태그를 넣어야 홈의 시리즈 타일에 모입니다."
      - name: toc
        label: 목차 표시
        type: boolean
        default: true
      - name: toc_sticky
        label: 목차 고정 (넓은 화면에서 오른쪽에 따라다님)
        type: boolean
        default: true
      - name: published
        label: 공개 (끄면 초안으로 저장만 되고 사이트에는 안 보임)
        type: boolean
        default: true
      - name: header
        label: 대표 이미지
        type: object
        fields:
          - name: teaser
            label: 카드 이미지 (선택)
            type: image
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown
        # The general column skeleton. The other templates live in _templates/
        # (the "글 템플릿" section below) to copy from.
        default: |
          ## 시작하며

          이 글에서 다룰 문제와, 왜 지금 이 이야기를 하는지 두세 문장으로 적습니다.

          ## 핵심 내용

          주장과 근거를 적습니다. 소제목(##)마다 목차 항목이 하나씩 생깁니다.

          ## 정리하며

          핵심을 한 문단으로 다시 묶고, 다음에 다룰 질문을 남깁니다.

  - name: templates
    label: 글 템플릿 (복사해서 사용)
    description: "새 글을 만들 때 본문에 붙여 넣을 뼈대입니다. 여기서 수정하면 다음 글부터 바뀐 뼈대를 쓰게 됩니다."
    type: collection
    path: _templates
    operations:
      create: false
      delete: false
      rename: false
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: 템플릿 이름
        type: string
      - name: usage
        label: 언제 쓰나
        type: text
      - name: body
        label: 본문 뼈대
        type: code
        options:
          format: markdown

  - name: tests
    label: 테스트
    description: "자기 점검 테스트. 여기서 만들거나 고치면 /tests/ 목록과 테스트 페이지가 자동으로 바뀝니다. 쓰는 법: docs/WRITING.md의 '테스트 만들기'."
    type: collection
    path: _pages/tests
    # The filename is the test's address without slashes: /web3-trust-test/
    # becomes web3-trust-test.md. Shown for a check before the first save.
    filename:
      template: "{fields.permalink}.md"
      field: create
    view:
      fields: [title, order, permalink]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: 테스트 이름
        type: string
        required: true
      - name: permalink
        label: 주소
        type: string
        required: true
        description: "슬래시로 감싼 영문 주소. 예: /money-habit-test/ (한 번 공개한 뒤에는 바꾸지 마세요. 공유된 링크가 깨집니다.)"
        pattern:
          regex: "^/[a-z0-9]+(-[a-z0-9]+)*/$"
          message: "/영문-소문자-주소/ 형식으로 적어 주세요."
      - name: order
        label: 목록 순서
        type: number
        description: "/tests/ 목록에서의 순서. 작을수록 앞에 나옵니다."
      - name: eyebrow
        label: 분류 라벨
        type: string
        description: "목록 카드 위에 작게 붙는 말. 예: AI, 투자, Web3"
      - name: description
        label: 한 줄 소개
        type: text
        required: true
        description: "목록 카드와 검색·공유 미리보기에 쓰입니다."
      - name: intro
        label: 시작 화면 문구
        type: text
        description: "제목 아래 문구. 줄바꿈이 그대로 화면에 나옵니다."
      - name: disclaimer
        label: 시작 화면 안내
        type: text
      - name: axes
        label: 두 축
        type: object
        description: "모든 질문은 두 축 중 하나에 점수를 더합니다. 결과는 두 축이 각각 높은지 낮은지로 정해집니다."
        fields:
          - name: a
            label: 축 A
            type: object
            fields:
              - { name: label, label: 축 이름, type: string, required: true }
              - { name: low, label: 낮은 쪽 끝 (0), type: string, required: true }
              - { name: high, label: 높은 쪽 끝 (100), type: string, required: true }
          - name: b
            label: 축 B
            type: object
            fields:
              - { name: label, label: 축 이름, type: string, required: true }
              - { name: low, label: 낮은 쪽 끝 (0), type: string, required: true }
              - { name: high, label: 높은 쪽 끝 (100), type: string, required: true }
      - name: questions
        label: 질문
        type: object
        list: true
        description: "10개 안팎을 권합니다. 두 축에 비슷한 수로 나누세요."
        fields:
          - name: q
            label: 질문
            type: text
            required: true
          - name: axis
            label: 점수를 더할 축
            type: select
            required: true
            options:
              values:
                - { value: a, label: 축 A }
                - { value: b, label: 축 B }
          - name: options
            label: 답변
            type: object
            list: true
            fields:
              - name: text
                label: 답변 문구
                type: text
                required: true
              - name: score
                label: 점수
                type: number
                required: true
                description: "0이 축의 낮은 쪽. 질문 안에서 가장 높은 점수가 그 축의 최대가 됩니다 (예: 0, 1, 2)."
              - name: concept
                label: 연결할 개념 키 (선택)
                type: string
                description: "아래 '개념 설명'의 키. 이 답을 고르면 결과 화면에 그 개념이 소개될 수 있습니다."
      - name: concepts_title
        label: 개념 설명 제목
        type: string
        default: 답변과 맞닿은 개념
      - name: concepts_intro
        label: 개념 설명 안내 문구
        type: text
      - name: concepts_empty
        label: 연결된 개념이 없을 때 문구
        type: text
      - name: concepts
        label: 개념 설명
        type: object
        list: true
        description: "결과 화면에는 가장 많이 고른 개념 3개가 나옵니다."
        fields:
          - name: key
            label: 키 (영문)
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9_]+$"
              message: "영문 소문자, 숫자, 밑줄만."
          - { name: label, label: 개념 이름, type: string, required: true }
          - { name: desc, label: 설명, type: text, required: true }
      - name: results
        label: 결과 유형
        type: object
        list: true
        description: "위치별로 하나씩, 모두 5개: A낮음·B낮음, A낮음·B높음, A높음·B낮음, A높음·B높음, 가운데(두 축 모두 35~65)."
        fields:
          - name: quadrant
            label: 위치
            type: select
            required: true
            options:
              values:
                - { value: low-low, label: "A 낮음 · B 낮음" }
                - { value: low-high, label: "A 낮음 · B 높음" }
                - { value: high-low, label: "A 높음 · B 낮음" }
                - { value: high-high, label: "A 높음 · B 높음" }
                - { value: middle, label: "가운데 (균형)" }
          - { name: emoji, label: 아이콘 (이모지 하나), type: string }
          - { name: type, label: 유형 라벨, type: string, description: "예: 저위험 · 원칙형" }
          - { name: name, label: 결과 이름, type: string, required: true }
          - { name: desc, label: 설명, type: text, required: true }
          - { name: checks, label: 스스로 점검해 볼 것, type: string, list: true }
      - name: result_disclaimer
        label: 결과 화면 안내
        type: text
      - name: related_label
        label: 결과 화면 링크 문구 (선택)
        type: string
        description: "비우면 '다른 테스트 둘러보기'."
      - name: related_url
        label: 결과 화면 링크 주소 (선택)
        type: string
        description: "비우면 /tests/. 예: /categories/web3/"
      - name: share_text
        label: 공유 문구
        type: text
